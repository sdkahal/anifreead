name: noad autobuild

# 定时检查上游 open-ani/animeko 的最新 release；有新版则:
# 拉 tag -> 套 noad.patch(过滤广告+重定向更新检查) -> 构建 Android arm64-v8a APK -> 发布到本仓库 releases
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      tag:
        description: '强制构建指定上游 tag (如 v5.7.1); 留空则取上游最新 release'
        required: false
        default: ''

permissions:
  contents: write

env:
  UPSTREAM: open-ani/animeko

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          if [ -n "$FORCE_TAG" ]; then
            TAG="$FORCE_TAG"
          else
            TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          fi
          OURS=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || echo "none")
          echo "upstream: $TAG / ours: $OURS"
          if [ -n "$FORCE_TAG" ] || [ "${TAG}-noad" != "$OURS" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream tag
        run: git clone --depth 1 --branch "$TAG" "https://github.com/$UPSTREAM.git" src

      - name: Apply noad patch and align version
        run: |
          set -eu
          cd src
          git apply --stat --apply ../noad.patch
          VER="${TAG#v}"
          sed -i "s/^version.name=.*/version.name=$VER/; s/^package.version=.*/package.version=$VER/" gradle.properties
          grep -E '^(version.name|package.version)' gradle.properties

      - name: Inject dandanplay keys (optional)
        env:
          DDP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DDP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          if [ -n "$DDP_ID" ]; then
            printf 'ani.dandanplay.app.id=%s\nani.dandanplay.app.secret=%s\n' "$DDP_ID" "$DDP_SECRET" >> src/local.properties
            echo "dandanplay keys injected"
          else
            echo "::warning::未配置 DANDANPLAY_APP_ID/SECRET secrets, 此构建的弹弹play弹幕源不可用"
          fi

      - name: Set ABI to arm64-v8a
        run: echo "ani.android.abis=arm64-v8a" >> src/local.properties

      - name: Prepare signing key
        id: signing
        env:
          BASE64_CONTENT: ${{ secrets.SIGNING_RELEASE_STOREFILE }}
          FILE_PATH: '${{ github.workspace }}/android_signing_key'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BASE64_CONTENT:-}" ]; then
            echo "SIGNING_RELEASE_STOREFILE is empty, will use debug keystore" >&2
            exit 0
          fi
          mkdir -p "$(dirname "$FILE_PATH")"
          if ! printf '%s' "$BASE64_CONTENT" | base64 --decode > "$FILE_PATH" 2>/dev/null; then
            printf '%s' "$BASE64_CONTENT" | base64 -D > "$FILE_PATH"
          fi
          chmod 600 "$FILE_PATH"
          echo "filePath=$FILE_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up JBR 21 (JCEF, Linux x64)
        run: |
          curl -fsSL --retry 3 -o jbr.tar.gz "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-linux-x64-b1163.116.tar.gz"
          mkdir jbr && tar -xzf jbr.tar.gz -C jbr --strip-components 1
          echo "JAVA_HOME=$PWD/jbr" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android arm64-v8a Release APK
        env:
          signing_release_storeFileFromRoot: ${{ steps.signing.outputs.filePath }}
          signing_release_storePassword: ${{ secrets.SIGNING_RELEASE_STOREPASSWORD }}
          signing_release_keyAlias: ${{ secrets.SIGNING_RELEASE_KEYALIAS }}
          signing_release_keyPassword: ${{ secrets.SIGNING_RELEASE_KEYPASSWORD }}
        working-directory: src
        run: >
          ./gradlew assembleDefaultRelease
          --stacktrace
          "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g"
          "-Dkotlin.daemon.jvm.options=-Xmx4g"

      - name: Collect artifact
        run: |
          set -eu
          APK=$(ls src/app/android/build/outputs/apk/default/release/android-default-arm64-v8a-release.apk | head -1)
          OUT="ani-${TAG#v}-noad-android-arm64-v8a.apk"
          mv "$APK" "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "基于官方 [${TAG}](https://github.com/open-ani/animeko/releases/tag/${TAG})。唯一修改见 [noad.patch](https://github.com/${{ github.repository }}/blob/noad-ci/noad.patch)：过滤播放页「相关推荐」中服务器下发的广告项，并将更新检查指向本仓库 releases。"
            echo ""
            echo "安装：下载 APK 后直接安装。"
            echo ""
            echo "依据 AGPL-3.0 分发；完整对应源码 = 上游 ${TAG} tag + 本仓库 noad.patch。"
          } > notes.md
          gh release create "${TAG}-noad" "$OUT" --title "Ani ${TAG} 去广告版 (Android arm64-v8a)" --notes-file notes.md
